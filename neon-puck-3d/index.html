/* Larger playable viewport and closer framing, without adding UI labels. */
.app-shell {
  max-width: 1920px;
  padding-left: clamp(9px, 1.1vw, 20px);
  padding-right: clamp(9px, 1.1vw, 20px);
}
.arena-wrap {
  height: clamp(720px, 90vh, 1200px);
}
@media (max-width: 700px) {
  .app-shell {
    padding: 7px 5px 18px;
  }
  .topbar {
    margin-bottom: 2px;
  }
  .score-panel {
    min-height: 82px;
    margin-bottom: 3px;
  }
  .arena-wrap {
    height: calc(100dvh - 112px);
    min-height: 530px;
    max-height: 1200px;
  }
}
@media (max-width: 380px) {
  .arena-wrap { min-height: 475px; }
}

/* Color-reactive, segmented competition display. */
:root {
  --player-accent: #43e9ff;
  --cpu-accent: #ff5eac;
}
.score-panel {
  width: min(1050px,100%);
  min-height: 120px;
  gap: clamp(8px,2vw,25px);
  padding: 8px clamp(10px,2vw,25px);
  border: 1px solid rgba(93,143,176,.24);
  border-radius: 15px;
  background: linear-gradient(125deg,rgba(19,42,65,.43),rgba(8,17,35,.72),rgba(29,36,63,.48));
  box-shadow: inset 0 1px rgba(180,233,255,.09), 0 14px 34px rgba(0,0,0,.12);
}
.scores {
  gap: clamp(9px,1.6vw,20px);
  padding: 4px clamp(9px,1.8vw,23px);
  border-radius: 13px;
  border: 1px solid #3b5771;
  background: linear-gradient(180deg,#06101d,#101e32 49%,#070f1c);
  box-shadow: inset 0 1px rgba(255,255,255,.08),inset 0 -4px 12px #0008,0 0 18px #3f789b18;
}
.score-number {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  min-width:0;
  font-size:0;
  line-height:0;
  height:100px;
  font-family:monospace;
  text-shadow:none;
}
.score-number.blue {color:var(--player-accent);text-shadow:none;}
.score-number.pink {color:var(--cpu-accent);text-shadow:none;}
.digital-digit {width:55px;height:96px;display:block;overflow:visible;flex-shrink:0;}
.score-number.blue .digital-digit {filter:drop-shadow(0 0 6px var(--player-accent));}
.score-number.pink .digital-digit {filter:drop-shadow(0 0 6px var(--cpu-accent));}
.digital-digit .segment {fill:currentColor;stroke:none;}
.digital-digit .segment.on {opacity:.98;}
.digital-digit .segment.off {opacity:.055;}
.center-message {color:var(--player-accent);text-shadow:0 4px #0a2435,0 0 52px var(--player-accent);}
.center-message.pink {color:var(--cpu-accent);text-shadow:0 4px #2b1733,0 0 52px var(--cpu-accent);}
.score-divider strong {color:#b3dcf5;text-shadow:0 0 12px #77c9ff5c;}
.competitor.player .identity-symbol {color:var(--player-accent);}
.competitor.cpu .identity-symbol {color:var(--cpu-accent);}
.player .score-dots i.filled {background:var(--player-accent);box-shadow:0 0 8px var(--player-accent);}
.cpu .score-dots i.filled {background:var(--cpu-accent);box-shadow:0 0 8px var(--cpu-accent);}
.color-picker {margin:17px auto 4px;}
.color-picker label {display:block;font-size:11px;color:#8fa6ba;font-weight:700;margin-bottom:11px;}
.color-options {display:flex;align-items:center;justify-content:center;gap:clamp(11px,2vw,18px);}
.color-swatch {
  width:36px;height:36px;flex:0 0 36px;
  border-radius:50%;border:3px solid #111d2c;
  background:var(--swatch);position:relative;
  box-shadow:inset 0 2px 5px #ffffff49,0 0 12px color-mix(in srgb,var(--swatch) 45%,transparent);
  transition:transform .15s,box-shadow .15s;
}
.color-swatch:hover {transform:translateY(-2px) scale(1.06);}
.color-swatch.selected {transform:scale(1.08);box-shadow:0 0 0 2px white,0 0 0 5px #263a50,0 0 20px var(--swatch);}
.color-swatch.selected:after {content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:900;color:#071221;text-shadow:0 1px #ffffff55;}
.overlay-card {width:min(465px,100%);}
.difficulty {margin:17px auto 18px;}
@media (max-width: 700px) {
  .score-panel {min-height:88px;padding:5px 9px;border-radius:11px;gap:5px;}
  .scores {padding:3px 5px;gap:5px;border-radius:9px;}
  .score-number {height:66px;}
  .digital-digit {width:35px;height:64px;}
  .score-divider {min-width:25px;}
  .score-divider strong {font-size:19px;}
  .score-divider span {font-size:6px;}
  .score-divider small {font-size:6px;}
  .competitor-tag {font-size:14px;}
  .color-picker {margin:14px auto 2px;}
  .color-options {gap:12px;}
  .color-swatch {width:31px;height:31px;flex-basis:31px;}
  .overlay-puck {width:62px;height:62px;margin:15px auto 12px;}
  .overlay-card {padding:20px 17px;}
  .difficulty {margin:13px auto 15px;}
}
@media (max-width:380px) {
  .digital-digit {width:31px;height:58px;}
  .score-number {height:60px;}
  .color-options {gap:9px;}
  .color-swatch {width:30px;height:30px;flex-basis:30px;}
}

</style>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><i></i><i></i></span><div><strong>NEON <em>PUCK</em></strong><small>3D AIR HOCKEY</small></div></div>
      <div class="top-right"><span class="live-dot"></span> <span class="mode-label">SOLO ARCADE</span><button id="soundButton" class="icon-button" aria-label="切換音效" title="切換音效"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="sound-wave" d="M16 9a5 5 0 0 1 0 6M19 6a9 9 0 0 1 0 12"/></svg></button><button id="pauseButton" class="icon-button" aria-label="暫停遊戲" title="暫停遊戲"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></div>
    </header>

    <main>
      <section class="score-panel" aria-label="即時比分">
        <div class="competitor player"><div class="competitor-tag"><span class="identity-symbol">●</span> YOU <span class="muted">/ 玩家</span></div><div id="playerDots" class="score-dots" aria-hidden="true"></div></div>
        <div class="scores"><div id="playerScore" class="score-number blue" aria-label="玩家 0 分">0</div><div class="score-divider"><span>FIRST TO</span><strong>10</strong><small>VS</small></div><div id="cpuScore" class="score-number pink" aria-label="電腦 0 分">0</div></div>
        <div class="competitor cpu"><div class="competitor-tag"><span class="identity-symbol">●</span> CPU <span class="muted">/ 電腦</span></div><div id="cpuDots" class="score-dots" aria-hidden="true"></div></div>
      </section>

      <section class="arena-wrap" aria-label="3D 曲棍球競技場">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
        <div id="arena" class="arena-canvas"><canvas id="gameCanvas" aria-label="曲棍球遊戲畫面"></canvas></div>
        <div class="arena-topline"><span><span class="live-dot"></span> LIVE MATCH</span><span id="roundLabel">MATCH 01</span></div>
        <div id="statusToast" class="status-toast" aria-live="polite"></div>
        <div id="centerMessage" class="center-message" aria-live="assertive"></div>
        <div id="overlay" class="overlay visible">
          <div class="overlay-card">
            <div class="eyebrow"><span class="tiny-line"></span> THE FUTURE OF AIR HOCKEY <span class="tiny-line"></span></div>
            <div class="overlay-puck"><span></span></div>
            <h1 id="overlayTitle">準備好開球了嗎？</h1>
            <p id="overlayDescription">滑動螢幕或移動滑鼠，控制你的球拍。<br>把冰球打進對方球門，先拿到 <b>10 分</b> 就獲勝！</p>
            <div id="colorArea" class="color-picker"><label>你的代表色</label><div class="color-options" role="group" aria-label="選擇代表色">
              <button type="button" data-color="ice" class="color-swatch selected" style="--swatch:#43e9ff" aria-label="冰藍" aria-pressed="true" title="冰藍"></button>
              <button type="button" data-color="red" class="color-swatch" style="--swatch:#ff536d" aria-label="熾紅" aria-pressed="false" title="熾紅"></button>
              <button type="button" data-color="gold" class="color-swatch" style="--swatch:#ffd258" aria-label="金黃" aria-pressed="false" title="金黃"></button>
